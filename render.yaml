# Render deployment configuration
services:
  - type: web
    name: cognitia-ai-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GROQ_API_KEY
        sync: false
      - key: MONGO_URI
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
